<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lintune – Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc2/dist/css/adminlte.min.css" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

  <!-- Navbar -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <!-- Realm switcher -->
        <li class="nav-item dropdown d-none" id="realm-switcher">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-building me-1"></i><span id="active-realm-label"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" id="realm-menu"></ul>
        </li>
        <!-- User menu -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span id="user-display-name"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="app-sidebar bg-dark navbar-dark shadow">
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-link">
        <span class="brand-text fw-bold">Lintune</span>
      </a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link active">
              <i class="nav-icon bi bi-speedometer2"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="users.html" class="nav-link">
              <i class="nav-icon bi bi-people"></i>
              <p>Users</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Main -->
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <h3 class="mb-0">Dashboard</h3>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div class="row" id="stats-row">
          <!-- Stats cards injected by JS -->
        </div>
      </div>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc2/dist/js/adminlte.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  (async () => {
    await handleCallback();
    requireAuth();
    setUserInfo();
    await initRealmSwitcher();

    try {
      const stats = await getDashboardStats();
      const row = document.getElementById('stats-row');
      const items = [
        { label: 'Total Users', value: stats.totalUsers, icon: 'bi-people', color: 'info' },
        { label: 'Active Users', value: stats.activeUsers, icon: 'bi-person-check', color: 'success' },
        { label: 'Disabled Users', value: stats.disabledUsers, icon: 'bi-person-x', color: 'warning' },
        { label: 'Groups', value: stats.totalGroups, icon: 'bi-diagram-3', color: 'primary' },
      ];
      row.innerHTML = items.map(i => `
        <div class="col-lg-3 col-6">
          <div class="small-box text-bg-${i.color}">
            <div class="inner">
              <h3>${i.value ?? '–'}</h3>
              <p>${i.label}</p>
            </div>
            <i class="small-box-icon bi ${i.icon}"></i>
          </div>
        </div>`).join('');
    } catch {
      document.getElementById('stats-row').innerHTML =
        '<div class="col-12"><div class="alert alert-warning">Could not load dashboard stats.</div></div>';
    }
  })();
</script>
</body>
</html>
