<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lintune – Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc2/dist/css/adminlte.min.css" />
</head>
<body class="login-page bg-body-secondary">

<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <span class="h1 fw-bold">Lintune</span>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Sign in to your account</p>

      <div id="alert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Step 1: email -->
      <form id="email-form">
        <div class="input-group mb-3">
          <input id="email" type="email" class="form-control" placeholder="Email" required autocomplete="email" />
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        </div>
        <button type="submit" class="btn btn-primary w-100">Continue</button>
      </form>

      <!-- Step 2: realm picker (hidden until email lookup) -->
      <form id="realm-form" class="d-none">
        <p class="text-muted small mb-2">Select your organisation</p>
        <div class="input-group mb-3">
          <select id="realm-select" class="form-select"></select>
          <span class="input-group-text"><i class="bi bi-building"></i></span>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
        <button type="button" id="back-btn" class="btn btn-link w-100 mt-1">Back</button>
      </form>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const alertEl = document.getElementById('alert');
  const emailForm = document.getElementById('email-form');
  const realmForm = document.getElementById('realm-form');
  const realmSelect = document.getElementById('realm-select');

  function showError(msg) {
    alertEl.textContent = msg;
    alertEl.classList.remove('d-none');
  }

  // Show error from redirect if any
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('error')) showError('Authentication failed. Please try again.');

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertEl.classList.add('d-none');
    const email = document.getElementById('email').value.trim();

    try {
      const realms = await getRealmsByEmail(email);
      if (!realms || realms.length === 0) {
        showError('No organisations found for this email address.');
        return;
      }

      realmSelect.innerHTML = realms.map(r => `<option value="${r}">${r}</option>`).join('');
      emailForm.classList.add('d-none');
      realmForm.classList.remove('d-none');
    } catch {
      showError('Could not look up your account. Please try again.');
    }
  });

  realmForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const realm = realmSelect.value;
    await startLogin(realm);
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    realmForm.classList.add('d-none');
    emailForm.classList.remove('d-none');
    alertEl.classList.add('d-none');
  });
</script>
</body>
</html>
