<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lintune – Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc2/dist/css/adminlte.min.css" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

  <!-- Navbar -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown d-none" id="realm-switcher">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-building me-1"></i><span id="active-realm-label"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" id="realm-menu"></ul>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i><span id="user-display-name"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="app-sidebar bg-dark navbar-dark shadow">
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-link">
        <span class="brand-text fw-bold">Lintune</span>
      </a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <i class="nav-icon bi bi-speedometer2"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="users.html" class="nav-link active">
              <i class="nav-icon bi bi-people"></i>
              <p>Users</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Main -->
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <h3 class="mb-0">Users</h3>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-header d-flex align-items-center">
            <h3 class="card-title me-auto">User List</h3>
            <input id="search" type="search" class="form-control w-auto" placeholder="Search…" />
          </div>
          <div class="card-body p-0">
            <div id="table-wrap">
              <div class="text-center p-4"><div class="spinner-border text-primary"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-rc2/dist/js/adminlte.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  let allUsers = [];

  function renderTable(users) {
    const wrap = document.getElementById('table-wrap');
    if (!users.length) {
      wrap.innerHTML = '<p class="text-center p-4 text-muted">No users found.</p>';
      return;
    }
    wrap.innerHTML = `
      <table class="table table-striped table-hover mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Username</th>
            <th>Status</th>
            <th>Groups</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.firstName ?? ''} ${u.lastName ?? ''}</td>
              <td>${u.email ?? '–'}</td>
              <td>${u.username ?? '–'}</td>
              <td>
                <span class="badge text-bg-${u.enabled ? 'success' : 'secondary'}">
                  ${u.enabled ? 'Active' : 'Disabled'}
                </span>
              </td>
              <td>${(u.groups ?? []).join(', ') || '–'}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderTable(allUsers.filter(u =>
      [u.firstName, u.lastName, u.email, u.username].some(v => v?.toLowerCase().includes(q))
    ));
  });

  (async () => {
    requireAuth();
    setUserInfo();
    await initRealmSwitcher();

    try {
      allUsers = await getUsers();
      renderTable(allUsers);
    } catch {
      document.getElementById('table-wrap').innerHTML =
        '<div class="alert alert-danger m-3">Could not load users.</div>';
    }
  })();
</script>
</body>
</html>
